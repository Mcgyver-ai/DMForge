name: Pre-Deploy Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Commit lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's own commits are needed to lint the range, not just the tip.
          fetch-depth: 0

      # Lints every commit the PR brings in. This used to read `git log -1`,
      # which on a pull_request checkout is GitHub's synthetic "Merge X into Y"
      # commit — so it failed on every PR ever opened — and its regex also
      # rejected scoped subjects like `fix(agent): …`.
      - name: Lint commit messages (Conventional Commits)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|chore|docs|perf|refactor|test)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            if git diff-tree --quiet "${sha}^" "$sha"; then
              echo "↷ $sha $subject (empty commit)"
              continue
            fi
            if echo "$subject" | grep -qE "$pattern"; then
              echo "✓ $sha $subject"
            else
              echo "::error::Commit $sha does not follow Conventional Commits: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE_SHA..$HEAD_SHA")
          if [ "$bad" -ne 0 ]; then
            echo "Expected: type(optional-scope): subject — types: feat, fix, chore, docs, perf, refactor, test"
            exit 1
          fi

      # The build is gated by ci.yml (which also runs on pull_request), and the
      # Playwright suite exercises live auth + Gemini against production, so it
      # stays manual in e2e.yml rather than running on every PR.
      - name: Merge checklist
        if: always()
        run: |
          echo "Before merge:"
          echo "  [ ] CI (build, unit specs, secret scan) is green"
          echo "  [ ] No Sentry errors in last 24h (https://sentry.io)"
          echo "  [ ] Firestore indexes deployed (if schema changed)"
          echo "  [ ] Firebase secrets in Secret Manager (if new functions)"
          echo "  [ ] .env.example updated with new env vars (if added)"
